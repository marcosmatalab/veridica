<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veridica</title>
<link rel="stylesheet" href="/estatico/estilo.css">
</head>
<body>
<header>
  <h1>VERIDICA</h1>
  <!-- ESTE AVISO SE QUEDÓ DICIENDO LO DE ANTEAYER Y SE SERVÍA POR HTTP. Decía "Encargo 2.4 · sin
       recuperación (fase 3) ni verificación (fase 4)" con las dos construidas y enchufadas desde
       hace días. No era la imagen: la cadena estaba viva en el repo, así que reconstruir no lo
       habría arreglado. Y lo que este cartel NO puede saber es qué sabe hacer ESTA instancia -sin
       torch no hay búsqueda por significado ni NLI-, así que eso lo dice `/salud`, que lo mide, y
       aquí solo se enlaza. Un cartel estático no debe afirmar capacidades del proceso. -->
  <span class="aviso">Recuperación sobre temario real y capa de verificación (cita literal,
    paráfrasis, cálculo y cobertura) <b>construidas y enchufadas</b>. Lo que esta instancia puede
    hacer ahora mismo lo dice <a href="/salud">/salud</a>, que lo comprueba en vez de declararlo.</span>
</header>

<main>
  <form class="selector" id="selector">
    <div>
      <label for="titulacion">Titulación</label>
      <select id="titulacion"></select>
    </div>
    <div>
      <label for="asignatura">Asignatura</label>
      <select id="asignatura"></select>
      <!-- LA EVIDENCIA NORMATIVA SE REUBICA, NO SE BORRA: código, curso, horas, RD, transversalidad
           y nº de fragmentos indexados son la prueba de que el corpus es real y está trazado al
           BOE. Dentro del <option> eran ilegibles y lo primero que veía quien llegaba; aquí siguen
           a un golpe de vista, en segundo plano. -->
      <div class="detalle" id="detalle-asignatura"></div>
    </div>
    <div>
      <label for="modo">Modo pedido</label>
      <select id="modo">
        <option value="responder">responder</option>
        <option value="acompanar">acompañar</option>
        <option value="corregir">corregir</option>
      </select>
    </div>
    <div class="interruptor">
      <input type="checkbox" id="verificacion" checked>
      <label for="verificacion" style="text-transform:none">Capa de verificación</label>
      <!-- Decía "sin efecto hasta la fase 4" y la fase 4 está enchufada: el motivo de que no tenga
           efecto ya no es ese. Hoy la capa se apaga con NLI_ACTIVO=0 en el proceso y la ablación
           POR PETICIÓN es el 7.3 — que es exactamente lo que la traza persiste en
           `solicitada_tiene_efecto: false`. La casilla se queda, con su motivo verdadero. -->
      <span class="sin-efecto">sin efecto: la ablación por petición es el 7.3</span>
    </div>
  </form>

  <form class="selector" id="preguntar" style="margin-top:12px">
    <div style="flex:1">
      <label for="texto">Tu pregunta</label>
      <input type="text" id="texto" style="width:100%"
             value="¿Qué es una clave primaria y por qué no puede repetirse?">
    </div>
    <button type="submit" id="enviar">Preguntar</button>
  </form>

  <ul class="etapas" id="etapas"></ul>
  <div class="prosa" id="prosa"></div>
  <div id="respuesta"></div>
  <div class="pie" id="pie"></div>
</main>

<script type="module" src="/estatico/app.js"></script>
</body>
</html>
