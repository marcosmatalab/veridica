# Configuracion de las herramientas del repo. No hay tabla [project] a proposito:
# esto todavia no es un paquete distribuible y nada del repo afirma en presente lo no construido.
#
# Version de Python: local es CPython 3.13.2 (base de miniconda) y el CI corre 3.13.
# Se alinean para que la puerta no pase en el runner y falle en la maquina de Marcos.

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
# Reglas fijadas POR ESCRITO, no heredadas del criterio de la version de ruff instalada:
# si manana ruff cambia sus reglas por defecto, esta puerta sigue siendo la misma.
#   F   -> incluye F401 (import sin usar) y F821 (nombre no definido), las que pide la guia
#   E4  -> imports; E7 -> sentencias; E9 -> errores de sintaxis y de E/S
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# scripts/ en el path para que un script pueda importar a otro (mobiliario, admitir) igual dentro
# de pytest que ejecutado a mano, donde sys.path[0] ya es scripts/.
#
# Y la raiz, que costo un CI en rojo del 2.2: los tests de app/ pasaban en local y fallaban en el
# runner con "No module named 'app'". No era el runner: era que en local se corre `python -m pytest`,
# que mete el directorio actual en sys.path, y el CI corre `pytest` a secas, que no. La puerta y la
# maquina de quien la escribe tienen que ejecutar lo mismo; declarar la raiz aqui hace que las dos
# formas de invocar sean equivalentes en vez de parecerlo.
pythonpath = [".", "scripts"]
