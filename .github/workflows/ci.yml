name: CI

# En TODAS las ramas, no solo en main: si el resultado llega en el merge, llega cuando ya no sirve.
on:
  push:
    branches: ['**']
  pull_request:

# Un push nuevo cancela el anterior de la misma rama: no se paga por resultados caducados.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  puerta:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` Y NO EL CLON SUPERFICIAL POR DEFECTO, con su motivo, porque cuesta unos
      # segundos y hay que saber por qué se pagan: la puerta de la cabecera de ESTADO comprueba que
      # el commit que esa cabecera nombra sea **antepasado de HEAD**, y con `depth: 1` ese commit no
      # está en el repo — así que el CI decía "no existe en este repo" sobre algo que sí existe.
      #
      # Es la divergencia de siempre entre dos puertas: verde local y rojo remoto MIDIENDO COSAS
      # DISTINTAS (historia entera contra un solo commit). El arreglo es que midan lo mismo, no
      # saltarse el test en la máquina que desafina — eso sería hacer callar a la única puerta que
      # sabe si ESTADO habla de esta historia o de otra.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3.13 para igualar el local (CPython 3.13.2, base de miniconda).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Los DOS ficheros, y no solo el de la puerta: los tests importan los scripts, y los scripts
      # importan lo que usan. Con solo requirements-dev.txt, la puerta unicamente podia probar
      # scripts sin dependencias de ejecucion, que es exactamente el incentivo contrario al que se
      # quiere. Lo descubrio el 2.1: un test del mapa importa el cargador, el cargador importa
      # psycopg, y en el runner no estaba (mismo fallo que transformers en la fase 1).
      - name: Instalar dependencias ancladas (ejecucion y puerta)
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Los tests del troceado usan el tokenizador REAL de BGE-M3 (decision del encargo 1.4: si el
      # troceado y el modelo no cuentan igual, el tamaño de fragmento declarado no es el que
      # existe). Se cachea para no bajarlo en cada corrida.
      - name: Cache del tokenizador de BGE-M3
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: tokenizador-bge-m3-v1

      - name: Version de las herramientas (queda en el log de la corrida)
        run: |
          python --version
          ruff --version
          pytest --version

      - name: ruff (reglas fijadas en pyproject.toml, F401 y F821 dentro)
        run: ruff check .

      - name: pytest
        run: pytest

# Lo que este flujo NO hace, y por que:
# - No corre scripts/verificar_manifiesto.py: el corpus esta fuera de git por diseno, asi que el
#   runner no lo tiene. Es puerta LOCAL (ADR 0001). Meterla aqui seria un rojo permanente y
#   acabariamos relajandola, que es peor que no tenerla.
# - No llama al proveedor de inferencia ni usa INFERENCIA_API_KEY: todavia no hay cliente ni cuenta,
#   y un flujo que nunca se ha visto pasar no es una puerta. Entra en la fase 2 (encargo 2.2).
